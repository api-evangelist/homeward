aid: homeward
name: Homeward
description: >-
  Homeward is a modern home-finance company founded in 2018 and headquartered in
  Austin, Texas, that partners with real estate agents to turn any homebuyer into
  a cash buyer. Its cash-offer products let buyers make competitive, contingency-free
  offers and buy a new home before selling their current one, bundled with
  affiliates Homeward Mortgage and Homeward Title. For its cash-offer digital
  partners, Homeward exposes the Offer Estimate API: partners submit seller leads
  (property, customer, and agent details) and receive a Homeward Offer Estimate —
  an offer amount, an opinion-of-value range, an Offer Estimate PDF, and a
  finalization link — plus a public buybox eligibility check. Homeward is backed by
  Norwest Venture Partners, Blackstone, Breyer Capital, Live Oak Venture Partners,
  Javelin Venture Partners, Adams Street, and others.
